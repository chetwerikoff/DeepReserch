name: Verify PR 12 exact head

on:
  push:
    branches:
      - agent/verify-pr12-head

permissions:
  contents: read

jobs:
  unit-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: 6234e0fd5d5881130c7844f6cca884815a92230f
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify checked out commit
        run: test "$(git rev-parse HEAD)" = "6234e0fd5d5881130c7844f6cca884815a92230f"
      - name: Run required unit suite
        run: python -m unittest -v tests.test_research
